name: Offline tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Run the offline suite with branch coverage
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/empty-tokenizer-cache
          HF_HUB_OFFLINE: "1"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: python -m pytest --cov=magic_llm --cov-branch --cov-report=term:skip-covered
