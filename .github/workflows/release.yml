name: Release

# Every push to the default branch cuts a new x.y.PATCH release.
#
# Why automatic: consumers install this package straight from the repo
# (`magic_llm @ git+https://github.com/Andres77872/magic-llm.git@master`), and pip
# only reinstalls a branch requirement when the built version differs from what is
# already in site-packages. Without a version bump on every push, `pip install`
# reports "already satisfied" and the consumer silently keeps running old code.
# Bumping the patch digit on each push is what makes "@master" mean "latest".
#
# Never pin a consumer to a commit hash. Two different direct URLs for the same
# distribution make pip fail with ResolutionImpossible; @master everywhere resolves.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

# Serialise releases so two pushes cannot race for the same patch number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pushes made with GITHUB_TOKEN do not retrigger workflows, and the bump commit
    # carries [skip ci]; this condition is the third belt against a release loop.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'chore(release):') &&
       github.event.head_commit.author.name != 'github-actions[bot]')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so bump_version.py can skip taken tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject commit-hash pins
        run: |
          if grep -rnE 'git\+https?://[^[:space:]]+@[0-9a-fA-F]{40}' \
               setup.cfg pyproject.toml requirements.txt 2>/dev/null; then
            echo "::error::A dependency above is pinned to a commit hash. Use @master so consumers always resolve to the latest release."
            exit 1
          fi
          echo "No commit-hash pins."

      - name: Bump patch version
        id: bump
        run: python scripts/bump_version.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Commit, tag and push
        env:
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magic_llm/__init__.py
          git commit -m "chore(release): ${TAG} [skip ci]"
          # Land on top of anything pushed while we were building, then tag the
          # final commit so the tag can never point at a rebased-away SHA.
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git tag -a "${TAG}" -m "magic_llm ${VERSION}"
          # --atomic: the branch and the tag both land, or neither does.
          git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${TAG}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes
