[metadata]
name = magic_llm
version = attr: magic_llm.__version__
author = Andres
author_email = andres@arz.ai
description = Client to unify with an easy python implementation with llm providers
long_description = file: README.md
long_description_content_type = text/markdown
keywords = llm
[options]
zip_safe = True
include_package_data = True
packages = find:
python_requires = >=3.10
install_requires =
    aiohttp>=3.14.5,<4
    async-timeout>=4,<6; python_version < "3.11"
    botocore>=1.37.3,<2
    jsonschema>=4.23,<5
    pydantic>=2.5.3,<3
    PyYAML>=6.0.2,<7
    referencing>=0.28.4,<1
    requests>=2.34.2,<3
    tiktoken>=0.9,<1
    tokenizers>=0.21,<1
    yarl>=1.25.1,<2

[options.extras_require]
notebook =
    nest-asyncio>=1.6,<2
test =
    pytest>=8.4,<10
    pytest-asyncio>=0.24,<2
    pytest-cov>=5,<8

[options.packages.find]
include =
    magic_llm
    magic_llm.*
