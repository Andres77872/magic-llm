[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = ["-m", "not provider_functional and not provider_health"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["test"]
markers = [
    "integration: offline multi-module seam tests with provider/network boundaries mocked",
    "provider_health: explicit live provider discovery/health smoke; excluded from offline gates",
    "provider_functional: explicit live/billable provider tests requiring credentials",
]
filterwarnings = [
    "ignore:datetime.datetime.utcnow():DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning:pytest_asyncio",
]

[tool.coverage.run]
branch = true
source = ["magic_llm"]

[tool.coverage.report]
fail_under = 78
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
