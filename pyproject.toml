[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]
markers = [
    "integration: offline multi-module seam tests with provider/network boundaries mocked",
    "slow: deterministic but slow tests excluded from quick local gates",
    "timeout: timeout behavior tests or pytest-timeout-controlled tests",
    "provider_health: explicit live provider discovery/health smoke; excluded from offline gates",
    "provider_functional: explicit live/billable provider tests requiring credentials",
]
filterwarnings = [
    "ignore:datetime.datetime.utcnow():DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning:pytest_asyncio",
]

[tool.coverage.run]
source = ["magic_llm"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
